<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#14482c">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">

<meta property="og:title" content="Liga Caimanera">
<meta property="og:description" content="Tabla de posiciones, resultados, goleadores y novedades de la Liga Caimanera.">
<meta property="og:url" content="https://invmarg.github.io/laliga/view/">
<meta property="og:image" content="https://invmarg.github.io/laliga/icons/share.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%9A%BD%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style id="app-style">
:root{
  --bg:#edf1e7; --surface:#ffffff; --surface-2:#e3eadb; --line:#cdd8c5; --ink:#11281b; --muted:#53695b;
  --turf:#14482c; --turf-ink:#f1f5ec;
  --amber:#f2b134; --amber-ink:#1d1403; --amber-text:#8a5a00;
  --red:#d43d36; --yellow:#e9b82a; --win:#1d8349; --draw:#b07f0f; --loss:#c23d36; --live:#e0362c;
  --score-bg:#10281b; --score-ink:#f6f8f2;
  --display:'Barlow Condensed','Arial Narrow','Roboto Condensed',system-ui,sans-serif;
  --body:'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:light;
  box-sizing:border-box;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0c2016; --surface:#12301f; --surface-2:#1a3e2a; --line:#29553e; --ink:#eef3ea; --muted:#9ab6a5;
    --turf:#0f3a23; --amber-text:#f4b63a; --score-bg:#07150e; --win:#46bd75; --draw:#d9a92f; --loss:#ef6a62;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0c2016; --surface:#12301f; --surface-2:#1a3e2a; --line:#29553e; --ink:#eef3ea; --muted:#9ab6a5;
  --turf:#0f3a23; --amber-text:#f4b63a; --score-bg:#07150e; --win:#46bd75; --draw:#d9a92f; --loss:#ef6a62;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{background:var(--bg);scroll-padding-top:calc(env(safe-area-inset-top,0px) + 64px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45}
img{max-width:100%;height:auto}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
h2,h3{margin:0}
.muted{color:var(--muted)}
.wrap{max-width:1080px;margin:0 auto;padding-left:16px;padding-right:16px}

/* Encabezado */
.masthead{position:relative;overflow:hidden;background:var(--turf);color:var(--turf-ink);padding-top:env(safe-area-inset-top,0px)}
.pitch{position:absolute;inset:0;width:100%;height:100%;opacity:.16;pointer-events:none}
.pitch *{vector-effect:non-scaling-stroke}
.mast-inner{position:relative;display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:14px 24px;padding-top:30px;padding-bottom:22px}
.mast-title{min-width:0}
.mast-title h1{margin:0;font-family:var(--display);font-weight:800;font-size:clamp(2.5rem,7.5vw,4.4rem);line-height:.9;letter-spacing:-.01em;text-wrap:balance;overflow-wrap:anywhere}
.mast-sub{margin:10px 0 0;font-weight:500;color:rgba(241,245,236,.78)}
.mast-tools{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.save{display:flex;align-items:center;flex-wrap:wrap;justify-content:flex-end;gap:8px;font-size:.88rem;color:rgba(241,245,236,.88)}
.led{width:9px;height:9px;border-radius:50%;background:#7fdc9f;flex:none}
.save.dirty .led{background:var(--amber)}
.save.err .led{background:#ff7a70}
.btn-turf{background:rgba(255,255,255,.1)!important;border-color:rgba(255,255,255,.28)!important;color:var(--turf-ink)!important}
.preview-bar{background:var(--amber);color:var(--amber-ink);font-weight:600}
.preview-bar .wrap{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;padding-top:8px;padding-bottom:8px}

/* Pestañas */
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.tabs .wrap{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.tabs .wrap::-webkit-scrollbar{display:none}
.tab{appearance:none;border:0;background:none;padding:14px 12px 11px;font-family:var(--display);font-weight:700;font-size:1.18rem;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap;cursor:pointer}
.tab:hover{color:var(--ink)}
.tab[aria-current="page"]{color:var(--ink);border-bottom-color:var(--amber)}
.main{padding-top:20px;padding-bottom:calc(56px + env(safe-area-inset-bottom,0px))}

/* Botones y campos */
.btn{appearance:none;display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink);border-radius:10px;padding:8px 14px;font-weight:600;font-size:.93rem;line-height:1.15;min-height:40px;cursor:pointer;text-decoration:none}
.btn:hover{border-color:var(--muted)}
.btn-primary{background:var(--amber);border-color:var(--amber);color:var(--amber-ink)}
.btn-primary:hover{border-color:var(--amber-ink)}
.btn-quiet{background:transparent}
.btn-danger{color:var(--loss);background:transparent;border-color:var(--loss)}
.btn-danger-solid{background:var(--loss);border-color:var(--loss);color:#fff}
.btn-sm{min-height:34px;padding:6px 11px;font-size:.86rem}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.btn.on-live{background:var(--live);border-color:var(--live);color:#fff}
.btn-row{display:flex;flex-wrap:wrap;gap:8px}
.icon-btn{appearance:none;border:0;background:none;color:var(--muted);cursor:pointer;padding:6px;border-radius:8px;min-width:36px;min-height:36px;display:inline-grid;place-items:center}
.icon-btn:hover{color:var(--loss);background:var(--surface-2)}
.ic{width:15px;height:15px;flex:none;vertical-align:-2px}
.input{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-height:40px;width:100%;min-width:0}
select.input{cursor:pointer}
input[type=color]{width:46px;height:40px;padding:3px;border:1px solid var(--line);border-radius:10px;background:var(--bg);cursor:pointer;flex:none}
.lbl{font-weight:600;font-size:.9rem}
.help{font-size:.86rem;color:var(--muted);margin:0}
.setting{display:flex;flex-direction:column;gap:6px;margin:0}
.fields2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fields2 .full{grid-column:1/-1}
.switch{display:flex;align-items:center;gap:10px;cursor:pointer;font-weight:500}
.switch input{width:20px;height:20px;accent-color:var(--turf);flex:none}

/* Paneles */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;min-width:0}
.panel + .panel{margin-top:16px}
.panel-head{display:flex;flex-wrap:wrap;gap:10px 16px;justify-content:space-between;align-items:flex-start;margin-bottom:14px}
.panel-head .tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.panel h2{font-family:var(--display);font-weight:700;font-size:1.65rem;line-height:1.05}
.panel-head .help{margin-top:4px;max-width:60ch}
.empty{padding:28px 18px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:14px}

/* Datos rápidos */
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:14px;overflow:hidden;margin:0 0 16px}
.fact{background:var(--surface);padding:12px 16px}
.fact dt{font-size:.84rem;color:var(--muted)}
.fact dd{margin:2px 0 0;font-family:var(--display);font-weight:700;font-size:1.35rem;line-height:1.15;overflow-wrap:anywhere}

/* Tabla */
.table-scroll{overflow-x:auto;margin:0 -18px;padding:0 18px}
table{border-collapse:collapse;width:100%}
.standings{min-width:640px}
.standings th{font-size:.8rem;font-weight:600;color:var(--muted);text-align:center;padding:8px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
.standings th.l{text-align:left}
.standings td{padding:9px 6px;text-align:center;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.standings tr:last-child td{border-bottom:0}
.standings td.team{text-align:left}
.standings td.pos{position:relative;width:44px;font-family:var(--display);font-weight:700;font-size:1.25rem}
tr.q td.pos::before,tr.q3 td.pos::before{content:"";position:absolute;left:0;top:7px;bottom:7px;width:4px;border-radius:2px;background:var(--amber)}
tr.q3 td.pos::before{background:var(--muted)}
.pts{font-family:var(--display);font-weight:800;font-size:1.35rem}
.dg-pos{color:var(--win);font-weight:600}
.dg-neg{color:var(--loss);font-weight:600}
.team-link{appearance:none;background:none;border:0;padding:4px 0;display:inline-flex;align-items:center;gap:10px;font-weight:600;cursor:pointer;text-align:left;color:var(--ink);max-width:260px}
.team-link:hover .tn{text-decoration:underline;text-underline-offset:3px}
.tn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dot{width:12px;height:12px;border-radius:50%;flex:none}
.form{display:inline-flex;gap:3px}
.f{width:21px;height:21px;border-radius:5px;font-size:.72rem;font-weight:700;display:inline-grid;place-items:center;color:#fff}
.f.G{background:var(--win)} .f.E{background:var(--draw)} .f.P{background:var(--loss)}
.legend{display:flex;flex-wrap:wrap;gap:6px 18px;margin:12px 0 0;font-size:.86rem;color:var(--muted)}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:2px;background:var(--amber);margin-right:7px}
.legend span.l3::before{background:var(--muted)}

/* Campeón */
.champ{display:grid;grid-template-columns:auto 1fr;gap:10px 22px;align-items:center;background:var(--score-bg);color:var(--score-ink);border-radius:16px;padding:22px 24px;margin-bottom:16px;border-left:8px solid var(--tc)}
.trophy{width:84px;height:92px;color:var(--amber);animation:rise .7s cubic-bezier(.2,.8,.2,1) both}
.champ-kicker{margin:0;color:var(--amber);font-family:var(--display);font-weight:700;font-size:1.2rem}
.champ-name{margin:0;font-family:var(--display);font-weight:800;font-size:clamp(2rem,6vw,3.3rem);line-height:.95;overflow-wrap:anywhere}
.champ-list{display:flex;flex-wrap:wrap;gap:6px 22px;margin:12px 0 14px;font-size:.92rem}
.champ-list dt{opacity:.7;font-size:.8rem}
.champ-list dd{margin:0;font-weight:600}
@keyframes rise{from{transform:translateY(14px) scale(.9);opacity:0}to{transform:none;opacity:1}}
@media (max-width:520px){.champ{grid-template-columns:1fr}.trophy{width:60px;height:66px}}

/* Partidos */
.filters{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:6px}
.fl{display:flex;flex-direction:column;gap:4px;font-size:.84rem;color:var(--muted);min-width:170px;flex:0 1 240px}
.md-head{font-family:var(--display);font-weight:700;font-size:1.4rem;margin:22px 0 10px;display:flex;align-items:baseline;gap:12px}
.md-head small{font-family:var(--body);font-weight:500;font-size:.85rem;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,440px),1fr));gap:12px}
.match{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.match.live{border-color:var(--live);box-shadow:inset 0 3px 0 var(--live)}
.match.final{border:2px solid var(--amber)}
.ko-label{font-family:var(--display);font-weight:700;font-size:1.2rem;line-height:1.1}
.ko-label small{display:block;font-family:var(--body);font-size:.82rem;font-weight:500;color:var(--muted)}
.match-meta{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:.86rem;color:var(--muted)}
.when{display:flex;flex-wrap:wrap;gap:2px 12px}
.badge{font-size:.78rem;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.badge.live{background:var(--live);color:#fff}
.badge.live::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:#fff;margin-right:6px;vertical-align:1px;animation:blink 1.2s steps(2) infinite}
.badge.done{background:transparent;border:1px solid var(--line)}
@keyframes blink{50%{opacity:0}}
.match-row{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px}
.side{display:flex;align-items:center;gap:8px;min-width:0;font-weight:600;line-height:1.2}
.side.home{justify-content:flex-end;text-align:right}
.side .nm{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.side .tbd{color:var(--muted);font-weight:500}
.plate{background:var(--score-bg);color:var(--score-ink);font-family:var(--display);font-weight:800;font-size:2rem;line-height:1;padding:8px 12px;border-radius:8px;min-width:90px;text-align:center;font-variant-numeric:tabular-nums;white-space:nowrap}
.plate .sep{opacity:.45;margin:0 7px}
.plate.vs{font-size:1.15rem;font-weight:700;padding:12px;opacity:.92}
.pens-line{margin:-4px 0 0;text-align:center;font-size:.86rem;font-weight:600;color:var(--amber-text)}
.warn{margin:0;font-size:.86rem;font-weight:600;color:var(--loss)}
.scorers{display:grid;grid-template-columns:1fr 1fr;gap:4px 28px;font-size:.86rem;color:var(--muted)}
.scorers ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:3px;min-width:0}
.scorers ul.h{align-items:flex-end;text-align:right}
.chip-card{display:inline-block;width:9px;height:12px;border-radius:2px;margin:0 2px;vertical-align:-1px}
.chip-card.yellow{background:var(--yellow)} .chip-card.red{background:var(--red)}
.match-actions{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;border-top:1px solid var(--line);padding-top:10px}
.match-actions.end{justify-content:flex-end}
.match-actions .grp{display:flex;flex-wrap:wrap;gap:6px}

/* Liguilla */
.bracket{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.bracket-col{display:flex;flex-direction:column;gap:12px;min-width:0}
.bracket-col h3{font-family:var(--display);font-weight:700;font-size:1.3rem;margin-top:4px}
@media (max-width:800px){.bracket{grid-template-columns:1fr}}

/* Estadísticas y equipos */
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,440px),1fr));gap:16px}
.two .panel + .panel{margin-top:0}
.list-table th{font-size:.8rem;font-weight:600;color:var(--muted);text-align:left;padding:8px 6px;border-bottom:1px solid var(--line)}
.list-table td{padding:9px 6px;border-bottom:1px solid var(--line);vertical-align:middle}
.list-table tr:last-child td{border-bottom:0}
.list-table .num{text-align:center;font-variant-numeric:tabular-nums;width:56px}
.list-table .rank{width:34px;color:var(--muted);font-family:var(--display);font-weight:700;font-size:1.1rem}
.big{font-family:var(--display);font-weight:800;font-size:1.3rem}
.shirt{display:inline-grid;place-items:center;min-width:28px;height:23px;padding:0 5px;border-radius:6px;background:var(--surface-2);font-family:var(--display);font-weight:700;font-size:.95rem;margin-right:8px}
.pl{display:flex;align-items:center;min-width:0}
.pl small{color:var(--muted);margin-left:6px}
.team-card{border-top:5px solid var(--tc)}
.te-head{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.te-name{flex:1 1 180px;font-family:var(--display);font-weight:700;font-size:1.3rem;padding:5px 10px}
.roster td{padding:4px 3px;border-bottom:1px solid var(--line)}
.roster td.n{width:58px} .roster td.p{width:112px} .roster td.x{width:40px;text-align:right}
.roster td .input{padding-left:7px;padding-right:4px}
.roster .input{min-height:36px;padding:6px 8px}
.addrow{display:grid;grid-template-columns:66px 1fr 132px auto;gap:6px;margin-top:10px}
@media (max-width:540px){.addrow{grid-template-columns:66px 1fr}.addrow select{grid-column:1/2}.roster td.p{width:104px}}
.roster-ro{list-style:none;margin:0;padding:0}
.roster-ro li{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:7px 0;border-bottom:1px solid var(--line)}
.roster-ro li:last-child{border-bottom:0}
.team-head-ro{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px}
.team-head-ro h3{font-family:var(--display);font-weight:700;font-size:1.4rem}
.settings{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,440px),1fr));gap:16px;align-items:start}
.settings-col{display:flex;flex-direction:column;gap:16px;min-width:0}
.settings-col .panel + .panel{margin-top:0}
.settings .panel + .panel{margin-top:0}
.settings .panel > * + *{margin-top:14px}
.panel.danger{border-color:var(--loss)}
@media (display-mode:standalone){
  html{overscroll-behavior-y:none}
  body::before{content:"";position:fixed;left:0;right:0;top:0;height:env(safe-area-inset-top,0px);background:var(--turf);z-index:40}
}
@media (max-width:600px){
  .standings{min-width:0}
  .standings .xs-hide{display:none}
  .standings th,.standings td{padding-left:4px;padding-right:4px}
  .standings td.pos{width:30px}
  .team-link{max-width:none}
  .standings .tn{white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
  .panel{padding:16px 14px}
  .table-scroll{margin:0 -14px;padding:0 14px}
}
.app-bar{background:var(--surface-2);border-bottom:1px solid var(--line)}
.app-bar .wrap{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 12px;padding-top:10px;padding-bottom:10px}
.app-bar-txt{font-weight:600;font-size:.92rem;flex:1 1 200px}
.app-bar .btn-row{align-items:center}
.tab-count{display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 6px;margin-left:6px;border-radius:999px;background:var(--live);color:#fff;font-family:var(--body);font-size:.74rem;font-weight:700;vertical-align:2px}
.nov-list{list-style:none;margin:0;padding:0}
.nov{display:grid;grid-template-columns:38px 1fr;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.nov:last-child{border-bottom:0}
.nov-ic{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;background:var(--surface-2);color:var(--ink)}
.nov-ic .ic{width:18px;height:18px}
.nov-ic.t-gol,.nov-ic.t-marcador{background:var(--win);color:#fff}
.nov-ic.t-vivo{background:var(--live);color:#fff}
.nov-ic.t-final{background:var(--score-bg);color:var(--score-ink)}
.nov-ic.t-roja{background:var(--red);color:#fff}
.nov-ic.t-campeon,.nov-ic.t-aviso{background:var(--amber);color:var(--amber-ink)}
.nov.new .nov-t::after{content:"Nuevo";margin-left:8px;font-size:.7rem;font-weight:700;padding:2px 7px;border-radius:999px;background:var(--live);color:#fff;vertical-align:2px}
.nov-t{margin:0;font-weight:700;line-height:1.25}
.nov-x{margin:3px 0 0;color:var(--muted);font-size:.93rem;overflow-wrap:anywhere}
.nov time{display:block;margin-top:4px;font-size:.8rem;color:var(--muted)}
.notif-card{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 16px}
.notif-card p{margin:0;max-width:56ch}
.steps{margin:0;padding-left:1.3em;display:flex;flex-direction:column;gap:8px}

function emptyMatch(extra){

function roundRobin(teams,format,random){
  var list=teams.map(function(t){return t.id;});
  if(random) shuffle(list);
  if(list.length%2) list.push(null);
  var n=list.length, rounds=n-1, pairs=[];
  for(var r=0;r<rounds;r++){
    for(var i=0;i<n/2;i++){
      var h=list[i], a=list[n-1-i];
      if(h&&a){ if(i===0&&r%2===1){var t=h;h=a;a=t;} pairs.push({h:h,a:a,r:r}); }
    }
    list.splice(1,0,list.pop());
  }
  var order=[]; for(var x=0;x<rounds;x++) order.push(x);
  if(random) shuffle(order);
  function md(r){return order.indexOf(r)+1;}
  var c=1, out=pairs.map(function(p){return emptyMatch({id:'m'+(c++),matchday:md(p.r),homeId:p.h,awayId:p.a});});

function normalize(raw){
  if(!raw||typeof raw!=='object'||!Array.isArray(raw.teams)) return null;
  var s={version:2,updatedAt:+raw.updatedAt||0,leagueName:String(raw.leagueName||'Liga Caimanera').slice(0,60),

  s.teams=raw.teams.map(function(t,i){
    var id=String(t.id!=null?t.id:'t'+(i+1));
    var pl=Array.isArray(t.players)?t.players:[];
    return {id:id,name:String(t.name||'Equipo '+(i+1)).slice(0,40),color:/^#[0-9a-f]{6}$/i.test(t.color)?t.color:'#1f9d55',
      players:pl.map(function(p,j){
        if(typeof p==='string') return {id:id+'p'+(j+1)+uid('-'),name:p,number:'',pos:'',base:false};
        return {id:String(p.id||uid('p')),name:String(p.name||'Jugador').slice(0,40),number:p.number==null?'':String(p.number).replace(/\D/g,'').slice(0,3),pos:POSITIONS[p.pos]?p.pos:'',base:!!p.base};
      })};
  });

  });
  function tid(v){return v==null||v===''?null:String(v);}

function vsText(m){return teamName(m.homeId)+' vs '+teamName(m.awayId);}
function scoreText(m){return teamName(m.homeId)+' '+m.homeScore+'–'+m.awayScore+' '+teamName(m.awayId);}
function whenText(m){var p=[];if(m.date)p.push(fmtDate(m.date));if(m.time)p.push(m.time);if(m.venue)p.push(m.venue);return p.join(', ');}
function scorersText(m){
  var agg={},order=[];
  m.events.forEach(function(e){if(e.type!=='goal') return;var k=e.playerId||e.playerName;if(!agg[k]){agg[k]={n:evName(e),g:0};order.push(k);}agg[k].g++;});
  return order.map(function(k){return agg[k].n+(agg[k].g>1?' ×'+agg[k].g:'');}).join(', ');
}
function diffEvents(prev){
  if(!prev||!prev.matches) return [];
  var ev=[], sched=[], pm={};
  prev.matches.forEach(function(m){pm[m.id]=m;});
  var sameCal=prev.matches.length===state.matches.length&&state.matches.every(function(m){var p=pm[m.id];return p&&p.homeId===m.homeId&&p.awayId===m.awayId&&p.matchday===m.matchday;});
  if(!sameCal&&state.matches.length){
    var md=Math.max.apply(null,state.matches.map(function(m){return m.matchday;}));
    ev.push({tipo:'calendario',titulo:'Nuevo calendario',texto:state.matches.length+' partidos en '+md+' jornadas. Revisa cuándo juega tu equipo.'});
  }
  function cmp(p,m,label){
    if(!p||!teamById(m.homeId)||!teamById(m.awayId)) return;
    var had={}; p.events.forEach(function(e){had[e.id]=1;});
    var goals=m.events.filter(function(e){return e.type==='goal'&&!had[e.id];});
    var reds=m.events.filter(function(e){return e.type==='red'&&!had[e.id];});
    if(m.status==='finished'&&p.status!=='finished'){
      var pens=(m.homeScore===m.awayScore&&m.homePens!=null&&m.awayPens!=null)?' (penales '+m.homePens+'–'+m.awayPens+')':'';
      var sc=scorersText(m);
      ev.push({tipo:'final',titulo:'Final · '+label,texto:scoreText(m)+pens+(sc?'. Goles: '+sc:'')});
      return;
    }
    if(m.status==='finished'&&(p.homeScore!==m.homeScore||p.awayScore!==m.awayScore||p.homePens!==m.homePens||p.awayPens!==m.awayPens)){
      ev.push({tipo:'marcador',titulo:'Resultado corregido · '+label,texto:scoreText(m)}); return;
    }
    if(m.status==='live'&&p.status==='pending') ev.push({tipo:'vivo',titulo:'Empezó · '+label,texto:vsText(m)+(m.venue?', '+m.venue:'')});
    if(m.status==='live'){
      if(goals.length>3) ev.push({tipo:'gol',titulo:'Goles · '+label,texto:scoreText(m)});
      else goals.forEach(function(g){ev.push({tipo:'gol',titulo:'¡Gol de '+evName(g)+'!',texto:scoreText(m)+' · '+label});});
      if(!goals.length&&p.status==='live'&&(p.homeScore!==m.homeScore||p.awayScore!==m.awayScore)) ev.push({tipo:'marcador',titulo:'Marcador · '+label,texto:scoreText(m)});
    }
    reds.forEach(function(r){ev.push({tipo:'roja',titulo:'Roja para '+evName(r),texto:'Jugador de '+teamName(r.teamId)+' · '+vsText(m)+', '+label});});
    if(m.status==='pending'&&(m.date||m.time)&&(p.date!==m.date||p.time!==m.time||p.venue!==m.venue)) sched.push(m);
  }
  if(sameCal) state.matches.forEach(function(m){cmp(pm[m.id],m,'Jornada '+m.matchday);});
  if(state.playoffsEnabled&&prev.playoffs){
    var L=koLabels(), set=[];
    KO_KEYS.forEach(function(k){
      var m=state.playoffs[k], p=prev.playoffs[k]; if(!m||!p) return;
      if(m.homeId&&m.awayId&&(p.homeId!==m.homeId||p.awayId!==m.awayId)) set.push(L[k][0]+': '+vsText(m));
      else cmp(p,m,L[k][0]);
    });
    if(set.length) ev.push({tipo:'liguilla',titulo:set.length===1?'Liguilla definida':'Cruces de la liguilla',texto:set.join(' · ')});
  }
  if(sched.length===1) ev.push({tipo:'horario',titulo:'Partido programado',texto:vsText(sched[0])+' · '+whenText(sched[0])});
  else if(sched.length>1) ev.push({tipo:'horario',titulo:'Horarios publicados',texto:sched.slice(0,3).map(function(m){return vsText(m)+' ('+whenText(m)+')';}).join(' · ')+(sched.length>3?' y '+(sched.length-3)+' más':'')});
  var now=championInfo(), before=null, keep=state;
  try{state=prev;before=championInfo();}catch(e){before=null;}finally{state=keep;}
  if(now&&(!before||before.champion!==now.champion)) ev.push({tipo:'campeon',titulo:'¡'+teamName(now.champion)+' es campeón!',texto:state.leagueName+(now.scorer?'. Goleador: '+now.scorer.name+' ('+now.scorer.goals+')':'')});
  return ev.slice(0,8);
}

function pushSupported(){return 'serviceWorker' in navigator&&'PushManager' in window&&'Notification' in window;}

function notifState(){

function keyBytes(s){s=String(s).replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';var b=atob(s),a=new Uint8Array(b.length);for(var i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return a;}
function sameKey(buf,b64){

      return s;

  }).then(function(sub){return gsCall('suscribir',sub.toJSON?sub.toJSON():sub);}).then(function(r){if(!r||!r.ok) throw new Error('srv');});

function enableNotifs(){

function relTime(t){
  var d=new Date(t), now=new Date(), diff=(now-d)/60000;
  var hm=String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
  if(diff<1) return 'Ahora';
  if(diff<60) return 'Hace '+Math.floor(diff)+' min';
  var y=new Date(now); y.setDate(now.getDate()-1);
  if(d.toDateString()===now.toDateString()) return 'Hoy, '+hm;
  if(d.toDateString()===y.toDateString()) return 'Ayer, '+hm;
  return fmtDate(isoOf(t))+', '+hm;

/* ---------- partidos ---------- */
function badge(s){
  if(s==='live') return '<span class="badge live">En vivo</span>';
  if(s==='finished') return '<span class="badge done">Finalizado</span>';
  return '<span class="badge">Por jugar</span>';
}
function eventsSummary(m){
  if(!m.events.length) return '';
  function side(tid){
    var agg={}, order=[];
    m.events.forEach(function(e){
      if(e.teamId!==tid) return;
      var k=e.playerId||e.playerName;
      if(!agg[k]){agg[k]={name:evName(e),g:0,y:0,r:0};order.push(k);}
      if(e.type==='goal') agg[k].g++; else if(e.type==='yellow') agg[k].y++; else agg[k].r++;
    });
    return order.map(function(k){var p=agg[k];
      return '<li><span>'+(p.g?ICON.ball+' ':'')+esc(p.name)+(p.g>1?' ×'+p.g:'')+(new Array(p.y+1).join('<span class="chip-card yellow" title="Amarilla"></span>'))+(new Array(p.r+1).join('<span class="chip-card red" title="Roja"></span>'))+'</span></li>';
    }).join('');
  }
  return '<div class="scorers"><ul class="h">'+side(m.homeId)+'</ul><ul>'+side(m.awayId)+'</ul></div>';
}
function lineupSummary(m){
  if(!teamById(m.homeId)||!teamById(m.awayId)) return '';
  var lh=lineupOf(m,m.homeId), la=lineupOf(m,m.awayId); if(!lh&&!la) return '';
  function names(tid,ids){return ids.map(function(id){var r=playerById(id);if(!r) return '';var p=r.p;
    return '<li>'+(p.number!==''?'#'+esc(p.number)+' ':'')+esc(p.name)+(r.wild?' <small>(comodín)</small>':r.t.id!==tid?' <small>(prestado de '+esc(r.t.name)+')</small>':'')+'</li>';}).join('');}
  function col(tid,l){if(!l) return '<div><p>Sin alineación</p></div>';
    return '<div><p>Titulares</p><ul>'+(names(tid,l.starters)||'<li class="muted">–</li>')+'</ul>'+(l.subs.length?'<p>Entraron</p><ul>'+names(tid,l.subs)+'</ul>':'')+'</div>';}
  return '<details class="lineups"><summary>Alineaciones</summary><div class="lu-cols">'+col(m.homeId,lh)+col(m.awayId,la)+'</div></details>';
}
function matchCard(m,o){
  var h=teamById(m.homeId), a=teamById(m.awayId), pend=m.status==='pending';
  var ref=' data-mk="'+o.kind+'" data-id="'+m.id+'"';
  var w=whenParts(m);
  var plate=pend?'<div class="plate vs">vs</div>':'<div class="plate">'+m.homeScore+'<span class="sep">–</span>'+m.awayScore+'</div>';
  var sideH='<div class="side home">'+(h?'<span class="nm">'+esc(h.name)+'</span><span class="dot" style="background:'+h.color+'"></span>':'<span class="nm tbd">Por definir</span>')+'</div>';
  var sideA='<div class="side">'+(a?'<span class="dot" style="background:'+a.color+'"></span><span class="nm">'+esc(a.name)+'</span>':'<span class="nm tbd">Por definir</span>')+'</div>';
  var pens=(!pend&&m.homeScore===m.awayScore&&m.homePens!=null&&m.awayPens!=null)?'<p class="pens-line">Penales '+m.homePens+'–'+m.awayPens+'</p>':'';
  var warn=(o.kind==='ko'&&m.status==='finished'&&h&&a&&!outcome(m))?'<p class="warn">Empate: registra los penales para definir quién avanza.</p>':'';
  var both=!!(h&&a), canShare=!pend&&both, actions='';
  if(isAdmin()){
    actions='<div class="match-actions"><div class="grp">'+
      '<button class="btn btn-sm'+(m.status==='live'?' on-live':'')+'" data-action="quick-status" data-status="live"'+ref+(both?'':' disabled')+'>En vivo</button>'+
      '<button class="btn btn-sm'+(m.status==='finished'?' on':'')+'" data-action="quick-status" data-status="finished"'+ref+(both?'':' disabled')+'>Finalizar</button></div><div class="grp">'+
      (canShare?'<button class="btn btn-sm btn-quiet" data-action="share" data-kind="match"'+ref+'>Compartir</button>':'')+
      '<button class="btn btn-sm btn-primary" data-action="edit-match"'+ref+'>Editar partido</button></div></div>';
  } else if(canShare){
    actions='<div class="match-actions end"><button class="btn btn-sm btn-quiet" data-action="share" data-kind="match"'+ref+'>Compartir resultado</button></div>';
  }
  return '<article class="match '+(m.status==='live'?'live ':'')+(o.cls||'')+'">'+
    (o.label?'<div class="ko-label">'+esc(o.label)+(o.sub?'<small>'+esc(o.sub)+'</small>':'')+'</div>':'')+
    '<div class="match-meta"><div class="when">'+(w.length?w.map(function(x){return '<span>'+esc(x)+'</span>';}).join(''):'<span>Sin fecha</span>')+(m.wildOn?'<span class="tag-c" style="margin-left:0">Con comodines</span>':'')+'</div>'+badge(m.status)+'</div>'+
    '<div class="match-row">'+sideH+plate+sideA+'</div>'+pens+warn+eventsSummary(m)+lineupSummary(m)+actions+'</article>';
}

/* ---------- estadísticas ---------- */
function playerCell(s,extra){
  return '<span class="pl">'+(s.number!==''?'<span class="shirt">'+esc(s.number)+'</span>':'')+'<span>'+esc(s.name)+(s.comodin?'<span class="tag-c">Comodín</span>':'')+(s.pos?'<small>'+POSITIONS[s.pos]+'</small>':'')+(extra?'<small class="loan-note">'+extra+'</small>':'')+'</span></span>';
}
function loanNote(x){
  var ks=Object.keys(x.loanGoals||{}); if(!ks.length) return '';
  if(x.comodin) return ks.map(function(k){var n=x.loanGoals[k];return n+(n===1?' gol':' goles')+' con '+esc(teamName(k));}).join(', ');
  return ks.map(function(k){var n=x.loanGoals[k];return n+(n===1?' gol':' goles')+' prestado a '+esc(teamName(k));}).join(', ');
}
function playedMatches(){
  var list=state.matches.filter(function(m){return m.status==='finished';});
  if(state.playoffsEnabled) KO_KEYS.forEach(function(k){var m=state.playoffs[k];if(m.status==='finished') list.push(m);});
  return list.filter(function(m){return teamById(m.homeId)&&teamById(m.awayId);});
}
function defenseTable(){
  var t={}; state.teams.forEach(function(x){t[x.id]={id:x.id,pj:0,gc:0,cs:0};});
  playedMatches().forEach(function(m){
    [[m.homeId,m.awayScore],[m.awayId,m.homeScore]].forEach(function(p){var r=t[p[0]];r.pj++;r.gc+=p[1];if(p[1]===0) r.cs++;});
  });
  return Object.keys(t).map(function(k){var r=t[k];r.avg=r.pj?r.gc/r.pj:0;return r;}).filter(function(r){return r.pj>0;})
    .sort(function(a,b){return a.avg-b.avg||b.cs-a.cs||b.pj-a.pj||teamName(a.id).localeCompare(teamName(b.id));});
}
function fairPlayTable(){
  var t={}; state.teams.forEach(function(x){t[x.id]={id:x.id,y:0,r:0};});
  var ms=state.matches.slice(); if(state.playoffsEnabled) KO_KEYS.forEach(function(k){ms.push(state.playoffs[k]);});
  ms.forEach(function(m){m.events.forEach(function(e){if(!t[e.teamId]) return;if(e.type==='yellow') t[e.teamId].y++;else if(e.type==='red') t[e.teamId].r++;});});
  return Object.keys(t).map(function(k){var r=t[k];r.pts=r.y+r.r*3;return r;})
    .sort(function(a,b){return a.pts-b.pts||a.r-b.r||teamName(a.id).localeCompare(teamName(b.id));});
}
function participation(){
  var r={};
  playedMatches().forEach(function(m){[m.homeId,m.awayId].forEach(function(tid){
    var l=lineupOf(m,tid); if(!l) return;
    function g(id){var q=playerById(id);return r[id]||(r[id]={id:id,teamId:q&&q.wild?null:(homeTeamOf(id)||tid),pj:0,tit:0,sup:0,pres:0});}
    l.starters.concat(l.subs).forEach(function(id){if(homeTeamOf(id)&&homeTeamOf(id)!==tid) g(id).pres++;});
    l.starters.forEach(function(id){var x=g(id);x.pj++;x.tit++;});

function keeperStats(){
  var r={};
  playedMatches().forEach(function(m){[[m.homeId,m.awayScore],[m.awayId,m.homeScore]].forEach(function(x){
    var tid=x[0], gc=x[1], l=lineupOf(m,tid); if(!l) return;
    var gk=null; l.starters.some(function(id){var q=playerById(id);if(q&&q.p.pos==='POR'){gk=q.p;return true;}return false;});
    if(!gk) return;
    var k=r[gk.id]||(r[gk.id]={id:gk.id,teamId:gk.comodin?null:(homeTeamOf(gk.id)||tid),pj:0,gc:0,cs:0}); k.pj++; k.gc+=gc; if(!gc) k.cs++;
  });});
  return Object.keys(r).map(function(k){var x=r[k];x.avg=x.gc/x.pj;return x;})
    .sort(function(a,b){return a.avg-b.avg||b.cs-a.cs||b.pj-a.pj;});
}
function keepers(tid){
  var used=keeperStats().filter(function(k){return k.teamId===tid;}).sort(function(a,b){return b.pj-a.pj;}).map(function(k){var q=playerById(k.id);return q?q.p.name:'';}).filter(Boolean);
  if(used.length) return used;
  var t=teamById(tid);return t?t.players.filter(function(p){return p.pos==='POR';}).map(function(p){return p.name;}):[];
}

/* ---------- diálogos ---------- */
function setDialogContent(el,html){
  document.body.appendChild(toastEl);
  el.innerHTML=html;
  if(toastEl.classList.contains('show')) el.appendChild(toastEl);
}
function openDialog(html,cls,st){
  var old=dlgRoot.querySelector('dialog[open]'); if(old) old.close();
  var d=document.createElement('dialog');
  d.className=cls||''; d.setAttribute('aria-labelledby','dlg-title');
  d.innerHTML=html; dlgRoot.appendChild(d);
  st.el=d; dlgState=st;
  d.addEventListener('close',function(){
    if(toastEl.parentNode===d) document.body.appendChild(toastEl);
    d.remove();
    if(dlgState===st) dlgState=null;
    if(st.onClose) st.onClose();
    if(dirty) schedulePublish(1500);
  });
  d.showModal();
  return d;
}
function closeDialog(){var d=dlgRoot.querySelector('dialog[open]');if(d) d.close();}
function refreshDialog(){
  if(!dlgState) return;
  if(dlgState.type==='match'){
    var b=dlgState.el.querySelector('.dlg-body'), sc=b?b.scrollTop:0, fk=focusKey();
    var html=matchDialogHtml(); if(!html){closeDialog();return;}
    setDialogContent(dlgState.el,html);
    var nb=dlgState.el.querySelector('.dlg-body'); if(nb) nb.scrollTop=sc;
    restoreFocus(fk);
  } else if(dlgState.type==='team'){
    var h=teamSheetHtml(dlgState.id); if(!h){closeDialog();return;}
    setDialogContent(dlgState.el,h);
  }
}
function dlgHead(title,sub,style){
  return '<div class="dlg-head"'+(style?' '+style:'')+'><div><h2 id="dlg-title">'+esc(title)+'</h2>'+(sub?'<p class="help">'+esc(sub)+'</p>':'')+'</div><button class="icon-btn" data-action="dlg-close" aria-label="Cerrar">'+ICON.close+'</button></div>';
}
function askConfirm(o){
  return new Promise(function(res){
    var answer=false;
    openDialog('<div class="dlg-head"><h2 id="dlg-title">'+esc(o.title)+'</h2></div><div class="dlg-body"><p>'+esc(o.body)+'</p></div>'+
      '<div class="dlg-foot"><button class="btn" data-action="dlg-close">Cancelar</button><button class="btn '+(o.danger?'btn-danger-solid':'btn-primary')+'" data-action="dlg-ok">'+esc(o.ok||'Confirmar')+'</button></div>','',

function newCanvas(w,h){

function handleChange(kind,el){
  var d=el.dataset, v=el.value, m, t, p;
  if(!isAdmin()&&!READONLY_CHANGES[kind]) return;
  switch(kind){
    case 'filter-md': ui.md=v; saveUI(); render(); break;
    case 'filter-team': ui.team=v; saveUI(); render(); break;
    case 'league-name': v=v.trim(); if(!v){render();return;} state.leagueName=v.slice(0,60); commit('Nombre de la liga actualizado'); break;
    case 'format':
      (function(){
        var go=function(){state.format=v==='double'?'double':'single'; regenerate(false); commit(v==='double'?'Formato: ida y vuelta':'Formato: solo ida');};
        if(hasResults()) askConfirm({title:'Cambiar formato',body:'El calendario se rehace y se borran los resultados cargados.',ok:'Cambiar formato',danger:true}).then(function(ok){if(ok) go(); else render();});
        else go();
      })(); break;
    case 'playoffs-enabled': state.playoffsEnabled=el.checked; commit(el.checked?'Liguilla activada':'Liguilla desactivada'); break;
    case 'ko-format': state.playoffsFormat=v; commit(KO_KEYS.some(function(k){return state.playoffs[k].homeId;})?'Formato cambiado. Pulsa “Asignar cruces” para aplicarlo.':'Formato de liguilla cambiado'); break;
    case 'team-name': t=teamById(d.id); v=v.trim(); if(!t) return; if(!v){render();return;} t.name=v.slice(0,40); commit('Nombre actualizado'); break;
    case 'team-color': t=teamById(d.id); if(!t) return; t.color=v; commit(); break;
    case 'p-number': case 'p-name': case 'p-pos':
      p=playerOf(d.team,d.player); if(!p) return;
      if(kind==='p-number') p.number=v.replace(/\D/g,'').slice(0,3);
      else if(kind==='p-pos') p.pos=POSITIONS[v]?v:'';
      else { v=v.trim(); if(!v){render();return;} p.name=v.slice(0,40); }
      commit(); break;
    case 'import':
      (function(){
        var f=el.files&&el.files[0]; if(!f) return;
        var rd=new FileReader();
        rd.onload=function(){
          var n=null; try{n=normalize(JSON.parse(rd.result));}catch(e){}
          el.value='';
          if(!n){toast('Ese archivo no es un respaldo de la liga.');return;}
          askConfirm({title:'Cargar respaldo',body:'Se reemplazan todos los datos actuales por los de “'+n.leagueName+'” ('+n.teams.length+' equipos, '+n.matches.length+' partidos).',ok:'Cargar respaldo',danger:true}).then(function(ok){
            if(!ok) return; state=n; ui.md='all'; ui.team='all'; commit('Respaldo cargado');
          });
        };
        rd.onerror=function(){toast('No se pudo leer el archivo.');};
        rd.readAsText(f);
      })(); break;
    case 'ko-team':
      m=dlgMatch(); if(!m) return;
      (function(){
        var side=d.side, other=side==='home'?m.awayId:m.homeId;
        if(v&&v===other){toast('Elige dos equipos distintos');refreshDialog();return;}
        m[side+'Id']=v||null; commit();
      })(); break;
    case 'pens':
      m=dlgMatch(); if(!m) return;
      m[d.side+'Pens']=v===''?null:Math.max(0,Math.min(30,parseInt(v,10)||0)); commit(); break;
    case 'status': m=dlgMatch(); if(!m) return; setStatus(m,v); commit(); break;
    case 'm-date': m=dlgMatch(); if(!m) return; m.date=/^\d{4}-\d{2}-\d{2}$/.test(v)?v:''; commit(); break;
    case 'm-time': m=dlgMatch(); if(!m) return; m.time=/^\d{2}:\d{2}$/.test(v)?v:''; commit(); break;
    case 'm-venue': m=dlgMatch(); if(!m) return; m.venue=v.trim().slice(0,60); commit(); break;
    case 'ev-team': if(!dlgState) return; dlgState.evTeam=v; dlgState.evPlayer=null; refreshDialog(); break;
    case 'ev-player': if(!dlgState) return; dlgState.evPlayer=v; break;
    case 'lu-team': if(!dlgState) return; dlgState.luTeam=v; refreshDialog(); break;
    case 'wild-on':
      m=dlgMatch(); if(!m) return;
      (function(){
        if(el.checked){m.wildOn=true; m.wild=m.wild||{}; commit('Partido con comodines: '+(state.starters+1)+' contra '+(state.starters+1)); return;}
        var ids=[]; Object.keys(m.wild||{}).forEach(function(k){ids=ids.concat(m.wild[k]||[]);});
        if(m.events.some(function(e){return ids.indexOf(e.playerId)>=0;})){toast('Un comodín tiene goles o tarjetas en este partido. Bórralos primero.',4000);refreshDialog();return;}
        Object.keys(m.lineups).forEach(function(k){var l=m.lineups[k]; l.starters=l.starters.filter(function(x){return ids.indexOf(x)<0;}); l.subs=l.subs.filter(function(x){return ids.indexOf(x)<0;});});
        m.wildOn=false; m.wild={}; commit('Partido sin comodines');
      })(); break;
    case 'p-base': p=playerOf(d.team,d.player); if(!p) return; p.base=el.checked; commit(); break;
    case 'p-role':
      p=playerOf(d.team,d.player); if(!p||d.team==='wild') return;
      p.base=v==='base'; commit(); break;
    case 'starters': state.starters=Math.max(3,Math.min(11,parseInt(v,10)||5)); commit('Jugadores en cancha: '+state.starters); break;
  }
}

function applyDraft(){
  try{
    var dft=normalize(JSON.parse(lsGet(DRAFT_KEY)||'null'));
    if(dft&&dft.updatedAt>state.updatedAt){state=dft;if(!localMode) dirty=true;}
  }catch(e){}

function restoreScroll(){if(ui.scroll){var y=ui.scroll;ui.scroll=0;requestAnimationFrame(function(){window.scrollTo(0,y);});}}
function initCaps(){
  var c=window.claude;
  if(needSetup){canEdit=false;localMode=false;render();return;}
  if(viewOnly&&!gs){canEdit=false;localMode=false;gsLoadErr='noapi';render();return;}
  if(gs){
    localMode=false; downloadsApi=null;
    if(gs.mode!=='admin') canEdit=false;
    findViewUrl();
    var start=function(){
      if(gs.mode!=='admin'){canEdit=false;render();restoreScroll();gsPoll();checkSubscription();return;}
      gsToken=lsGet(TOKEN_KEY);
      if(!gsToken){render();return;}
      gsChecking=true; render();
      gsCall('validar',gsToken).then(function(r){
        if(r&&r.ok) gsStartAdmin(r); else {gsChecking=false;gsLogout('');}
      }).catch(function(){gsChecking=false;loginMsg='No se pudo conectar. Revisa tu internet.';render();});
    };
    if(gs.api){
      gsLoading=true; render();
      gsCall('datosPublicos').then(function(r){cacheSave(r);gsLoaded(r);gsLoading=false;start();})
        .catch(function(){
          gsLoading=false;
          var c=null; try{c=viewOnly?JSON.parse(lsGet(CACHE_KEY)||'null'):null;}catch(e){}
          if(c&&c.data){gsLoaded(c);start();toast('Sin conexión: se muestra la última versión guardada',4000);}
          else {gsLoadErr=true;render();}
        });
    } else start();
    return;
  }
  if(publicCopy){localMode=true;canEdit=false;render();return;}
  if(!c||typeof c.use!=='function'){localMode=true;canEdit=true;applyDraft();render();restoreScroll();return;}
  Promise.all([c.use('artifact'),c.use('user'),c.use('downloads')].map(function(p){return Promise.resolve(p).catch(function(){return null;});})).then(function(r){
    artifactApi=r[0]; downloadsApi=r[2]; var usr=r[1];
    var edit=usr&&usr.canEdit?Promise.resolve(usr.canEdit()).catch(function(){return false;}):Promise.resolve(!!artifactApi);
    return edit.then(function(v){
      canEdit=!!v&&!!artifactApi;
      if(canEdit) applyDraft();
      render(); restoreScroll();
      if(canEdit&&dirty) schedulePublish(3000);
    });
  });
}

      var api=fixed||fromLink||saved;
      apiSource=fixed?'file':fromLink?'link':saved?'saved':'';
      if(fromLink) lsSet(API_KEY,fromLink);
      if(api) gs=makeGs(api);
    }
  }catch(e){}
  try{var md=document.getElementById('league-mode');publicCopy=!!md&&JSON.parse(md.textContent)==='public';}catch(e){}
  var raw=null; try{raw=JSON.parse(document.getElementById('league-data').textContent||'null');}catch(e){}
  state=normalize(raw)||seedState();
  try{var u=JSON.parse(lsGet(UI_KEY)||'null');if(u){ui.tab=u.tab||ui.tab;ui.md=u.md||'all';ui.team=u.team||'all';ui.scroll=u.scroll||0;}}catch(e){}
  if(location.hash==='#novedades'){ui.tab='news';ui.scroll=0;}
  pwaInit();
  render();
  initCaps();
}
boot();
})();
</script>
</body>
</html>
